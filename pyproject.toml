[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fionna"
version = "0.1.0"
description = "Functional Inference with Orthogonal Neural Network Adjustment"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2",
  "scipy>=1.18",
  "scikit-learn>=1.9",
  "pandas>=3.0",
]

[tool.setuptools.packages.find]
include = ["fionna*"]
