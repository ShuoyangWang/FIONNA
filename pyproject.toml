[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fionna"
version = "0.1.0"
description = "Functional Inference with Orthogonal Neural Network Adjustment"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["fionna*"]
